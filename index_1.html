<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escala de Outubro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ferramenta de consulta de coluna única — cabeçalho, abas, controle, resultado */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#dbe2df;
  --accent:#0f6b5c; --accent-soft:#e0efeb; --weekend:#eef0f6;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --fg:#e7eeeb; --muted:#93a39d; --line:#2a3531;
  --accent:#5cc8b1; --accent-soft:#1d3530; --weekend:#1a1f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --fg:#e7eeeb; --muted:#93a39d; --line:#2a3531;
  --accent:#5cc8b1; --accent-soft:#1d3530; --weekend:#1a1f2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:20px}
header h1{font:700 clamp(28px,6vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{font:600 14px var(--body);border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.ctl label{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1 1 220px;min-width:0}
select,input{font:500 16px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip button{flex:0 0 auto;display:grid;justify-items:center;gap:0;min-width:52px;padding:6px 4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer;font-family:var(--body)}
.strip button.wk{background:var(--weekend)}
.strip button .d{font:600 18px var(--mono)}
.strip button .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.strip button.hol .w{color:#3f8f2f}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.stats b{font:600 20px var(--mono);color:var(--fg);margin-right:4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.wk{background:var(--weekend)}
.row .dt{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .dt strong{color:var(--fg);font-weight:500}
.weekhead{padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.weekhead:first-child{border-top:0}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.chip i{flex:0 0 12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip.free{color:var(--muted);font-weight:500}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px}
.group{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.group:first-child{border-top:0}
.group .who{display:flex;flex-wrap:wrap;gap:6px}
.who span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.empty{padding:20px 14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
@media (max-width:480px){.row{grid-template-columns:96px 1fr}}
@media (prefers-reduced-motion:no-preference){.list{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Escala de Outubro</h1>
    <p>1º de outubro a 1º de novembro de 2026 · dias úteis e fins de semana</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-pessoa" data-v="pessoa">Por pessoa</button>
    <button role="tab" id="t-dia" data-v="dia">Por dia</button>
    <button role="tab" id="t-local" data-v="local">Por local</button>
  </div>

  <section id="v-pessoa" hidden>
    <div class="ctl"><label for="selPessoa">Pessoa<select id="selPessoa"></select></label></div>
    <div class="stats" id="statsPessoa"></div>
    <div class="list" id="listPessoa"></div>
  </section>

  <section id="v-dia" hidden>
    <div class="strip" id="strip"></div>
    <div class="ctl"><label for="busca">Filtrar por nome<input id="busca" type="search" placeholder="Digite um nome"></label></div>
    <div class="list" id="listDia"></div>
  </section>

  <section id="v-local" hidden>
    <div class="ctl"><label for="selLocal">Local<select id="selLocal"></select></label></div>
    <div class="list" id="listLocal"></div>
  </section>

  <p class="note">Transcrito da planilha de escala. Em caso de divergência, vale a planilha oficial.</p>
</div>

const COLORS={"OSASCO": "#FFFF00", "INSTITUTO": "#4A2317", "TABOAO": "#A9D08E", "ARICA": "#FF9900", "ARICA JULIAO": "#FF9900", "ARICA CÍCERO": "#FF9900", "CC": "#3F3100", "SANTA CRUZ": "#E8483B", "ENFERMARIA + HM NOITE": "#FFA000", "ENFERMARIA": "#FFD28A", "TAMBORÉ": "#00E5FF", "CENTER NORTE": "#F8696B", "SANTO ANDRE": "#5B4A9E", "SBC": "#FF0000", "HM BELEM + NOITE": "#A87C0C", "SP MARKET": "#00E000", "PAP": "#0B1F4B", "SANTANA": "#3D85C6", "GRU": "#FF00FF", "ITAQUERA": "#666666", "WEST PLAZA": "#8B4513", "COBERTURA": "#1C1C3C", "P. PAULISTA": "#9900FF", "C.C ANDY": "#3A2410", "TUCURUVI": "#F6B26B", "OFF": "#9aa3a0", "FÉRIAS": "#1b1b1b", "ELDORADO": "#A64D79", "MORUMBI": "#6FA8DC", "TRABALHA": "#38761D", "HM": "#c0392b", "HM + PA 18 - 23H": "#7d3c98", "PA 08 - 20h": "#2e86c1", "PA 18 - 23H": "#1a5276", "MUTIRAO": "#d68910", "UNEX": "#17a589", "OTONEURO": "#6c3483", "FERIADO": "#6AA84F"};
const HOLIDAY="2026-10-12";
const WD=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const WDL=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=pd(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
const isWk=s=>{const g=pd(s).getDay();return g===0||g===6};
const DATES=[];for(let d=new Date(2026,9,1);d<=new Date(2026,10,1);d.setDate(d.getDate()+1)){DATES.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))}
const NAMES=[...new Set(ROWS.map(r=>r[1]))];
const byKey=new Map(ROWS.map(r=>[r[0]+"|"+r[1],r]));
const label=v=>v==="TRABALHA"?"Trabalha (feriado)":v==="FERIADO"?"Feriado":v==="OFF"?"Folga":v;
const chip=v=>{if(!v)return '<span class="chip free">Livre</span>';const c=COLORS[v]||"var(--muted)";return `<span class="chip"><i style="background:${c}"></i>${esc(label(v))}</span>`};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Pessoa
$("selPessoa").innerHTML=NAMES.map(n=>`<option>${esc(n)}</option>`).join("");
function renderPessoa(){
  const n=$("selPessoa").value;store.set("pessoa",n);
  let html="",plant=0,fds=0,fer=0,lastWeek=null;
  for(const d of DATES){
    const r=byKey.get(d+"|"+n);const v=r?r[2]:"";
    const g=pd(d).getDay();const wk=(g===0||g===6);
    const monday=new Date(pd(d));monday.setDate(monday.getDate()-((g+6)%7));
    const wkey=monday.toDateString();
    if(wkey!==lastWeek){const sun=new Date(monday);sun.setDate(sun.getDate()+6);
      const a=d===DATES[0]?pd(d):monday;
      html+=`<div class="weekhead">Semana de ${String(a.getDate()).padStart(2,"0")}/${String(a.getMonth()+1).padStart(2,"0")} a ${String(sun.getDate()).padStart(2,"0")}/${String(sun.getMonth()+1).padStart(2,"0")}</div>`;lastWeek=wkey}
    if(v==="FÉRIAS")fer++;else if(v&&!["FERIADO","OFF"].includes(v)){plant++;if(wk)fds++}
    html+=`<div class="row${wk?" wk":""}"><span class="dt"><strong>${fmt(d)}</strong> ${WD[g]}</span><span>${chip(v)}${d===HOLIDAY?'<span class="tag">Feriado</span>':""}</span></div>`;
  }
  $("listPessoa").innerHTML=html;
  $("statsPessoa").innerHTML=`<span><b>${plant}</b>plantões</span><span><b>${fds}</b>em fins de semana</span><span><b>${fer}</b>dias de férias</span>`;
}
$("selPessoa").addEventListener("change",renderPessoa);

// Dia
let dia=null;
function renderStrip(){
  $("strip").innerHTML=DATES.map(d=>{const g=pd(d).getDay();return `<button type="button" data-d="${d}" class="${isWk(d)?"wk":""}${d===HOLIDAY?" hol":""}" aria-pressed="${d===dia}" aria-label="${WDL[g]} ${fmt(d)}"><span class="w">${WD[g]}</span><span class="d">${pd(d).getDate()}</span></button>`}).join("");
}
function renderDia(){
  store.set("dia",dia);
  $("strip").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===dia));
  const q=$("busca").value.trim().toLowerCase();
  const groups=new Map();let semEscala=[];
  for(const n of NAMES){
    if(q&&!n.toLowerCase().includes(q))continue;
    const r=byKey.get(dia+"|"+n);const v=r?r[2]:"";
    if(!v){semEscala.push(n);continue}
    if(!groups.has(v))groups.set(v,[]);groups.get(v).push(n);
  }
  const order=[...groups.keys()].sort((a,b)=>{const s=x=>["FÉRIAS","OFF","FERIADO"].includes(x)?1:0;return s(a)-s(b)||a.localeCompare(b,"pt")});
  const g=pd(dia).getDay();
  let html=`<div class="weekhead">${WDL[g]}, ${fmt(dia)}${dia===HOLIDAY?" · feriado":""}</div>`;
  for(const k of order)html+=`<div class="group">${chip(k)}<div class="who">${groups.get(k).map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`;
  if(semEscala.length)html+=`<div class="group"><span class="chip free">Sem escala neste dia</span><div class="who">${semEscala.map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`;
  if(!order.length&&!semEscala.length)html+=`<div class="empty">Nenhum nome encontrado para “${esc(q)}”.</div>`;
  $("listDia").innerHTML=html;
}
$("strip").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;dia=b.dataset.d;renderDia()});
$("busca").addEventListener("input",renderDia);

// Local
const LOCAIS=[...new Set(ROWS.map(r=>r[2]))].filter(v=>!["FÉRIAS","OFF","FERIADO","TRABALHA"].includes(v)).sort((a,b)=>a.localeCompare(b,"pt"));
$("selLocal").innerHTML=LOCAIS.map(l=>`<option>${esc(l)}</option>`).join("");
function renderLocal(){
  const l=$("selLocal").value;store.set("local",l);
  let html="";
  for(const d of DATES){
    const who=NAMES.filter(n=>{const r=byKey.get(d+"|"+n);return r&&r[2]===l});
    if(!who.length)continue;
    const g=pd(d).getDay();
    html+=`<div class="row${isWk(d)?" wk":""}"><span class="dt"><strong>${fmt(d)}</strong> ${WD[g]}</span><div class="who">${who.map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`;
  }
  $("listLocal").innerHTML=`<div class="weekhead">${chip(l)}</div>`+(html||'<div class="empty">Ninguém escalado neste local.</div>');
}
$("selLocal").addEventListener("change",renderLocal);

// Tabs
function show(v){
  for(const k of ["pessoa","dia","local"]){$("v-"+k).hidden=k!==v;$("t-"+k).setAttribute("aria-selected",k===v)}
  store.set("aba",v);
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)});

// Init
const today=new Date();const tk=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
dia=DATES.includes(tk)?tk:(DATES.includes(store.get("dia"))?store.get("dia"):DATES[0]);
const sp=store.get("pessoa");if(sp&&NAMES.includes(sp))$("selPessoa").value=sp;
const sl=store.get("local");if(sl&&LOCAIS.includes(sl))$("selLocal").value=sl;
renderStrip();renderDia();renderPessoa();renderLocal();
const hash=location.hash.slice(1);
show(["pessoa","dia","local"].includes(hash)?hash:(store.get("aba")||"dia"));
const sel=$("strip").querySelector('[aria-pressed="true"]');if(sel)sel.scrollIntoView({block:"nearest",inline:"center"});
</script>
